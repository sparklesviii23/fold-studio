<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 56" width="900" height="56" role="img" aria-label="Structure prediction, protein design, RNA folding, cell simulation, cancer data">
  <defs>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9fdcff"/><stop offset=".5" stop-color="#cfe9ff"/><stop offset="1" stop-color="#b9a6ff"/></linearGradient>
  </defs>
  <style>
    text{font-family:SFMono-Regular,Menlo,Consolas,monospace;font-size:26px;font-weight:600;fill:url(#t);text-anchor:middle;opacity:0}
    .w{animation:cycle 15s infinite}
    .w1{animation-delay:0s}.w2{animation-delay:3s}.w3{animation-delay:6s}.w4{animation-delay:9s}.w5{animation-delay:12s}
    @keyframes cycle{0%{opacity:0;transform:translateY(10px)}3%{opacity:1;transform:translateY(0)}17%{opacity:1;transform:translateY(0)}20%{opacity:0;transform:translateY(-10px)}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.w{animation:none}.w1{opacity:1}}
  </style>
  <text class="w w1" x="450" y="38">❯ structure prediction</text>
  <text class="w w2" x="450" y="38">❯ protein design on Apple Silicon</text>
  <text class="w w3" x="450" y="38">❯ RNA folding, kinetics and design</text>
  <text class="w w4" x="450" y="38">❯ cell simulation inside a real HeLa cell</text>
  <text class="w w5" x="450" y="38">❯ cancer data, side by side</text>
</svg>
