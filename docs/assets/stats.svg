<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="9 cloud task recipes; 1,178 cancer cell lines; 1.83 angstrom RMSD to the tRNA crystal; 70-odd lab documents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b1f"/><stop offset="1" stop-color="#0b1026"/></linearGradient>
    <linearGradient id="n" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfe9ff"/><stop offset="1" stop-color="#d9ccff"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fdcff" stop-opacity=".5"/><stop offset="1" stop-color="#b9a6ff" stop-opacity=".5"/></linearGradient>
  </defs>
  <style>
    .n{font-family:'New York',Georgia,'Times New Roman',serif;font-size:46px;fill:url(#n);text-anchor:middle}
    .l{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:15px;fill:#9fb3d9;text-anchor:middle;letter-spacing:.6px}
    .c{animation:up .9s ease-out both}.c2{animation-delay:.15s}.c3{animation-delay:.3s}.c4{animation-delay:.45s}
    @keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){.c{animation:none}}
  </style>
  <rect x="1" y="1" width="1198" height="148" rx="22" fill="url(#bg)" stroke="url(#b)"/>
  <g stroke="#9fdcff" stroke-opacity=".18"><line x1="300" y1="30" x2="300" y2="120"/><line x1="600" y1="30" x2="600" y2="120"/><line x1="900" y1="30" x2="900" y2="120"/></g>
  <g class="c"><text class="n" x="150" y="80">9</text><text class="l" x="150" y="112">CLOUD TASK RECIPES</text></g>
  <g class="c c2"><text class="n" x="450" y="80">1,178</text><text class="l" x="450" y="112">CANCER CELL LINES (DEPMAP)</text></g>
  <g class="c c3"><text class="n" x="750" y="80">1.83 Å</text><text class="l" x="750" y="112">RMSD TO THE tRNA CRYSTAL</text></g>
  <g class="c c4"><text class="n" x="1050" y="80">70+</text><text class="l" x="1050" y="112">LAB DOCUMENTS</text></g>
</svg>
